name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write  # Required for PyPI Trusted Publishing (OIDC)
  contents: read

jobs:
  publish:
    name: build and publish
    runs-on: ubuntu-latest
    # Restrict to the repo that owns the package to avoid abuse if forks exist.
    # The comparison is a case-sensitive string match against github.repository,
    # so the owner casing has to be GitHub's canonical 'Omonire-Great'. Lowercase
    # 'omonire-great' resolves in a browser but fails this test, and the job then
    # skips as a no-op rather than failing loudly.
    if: github.repository == 'Omonire-Great/gromon-limiter'
    environment: pypi
    permissions:
      id-token: write  # Required for PyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # Build once from a clean checkout
      - name: Build distributions
        run: python -m build

      # Sanity-check the distribution metadata before uploading
      - name: Check distributions
        run: twine check dist/*

      # Trusted publishing (OIDC) cannot create a project: a PyPI project only
      # comes into existence through an upload, and a publisher cannot be
      # registered against a name that does not exist yet. So the very first
      # release of gromon-limiter needs a one-off token, supplied as the
      # PYPI_API_TOKEN secret. An unset secret expands to an empty string, which
      # the action treats as absent and falls back to OIDC, so once a trusted
      # publisher is registered on PyPI this step needs no credential at all.
      # After the first successful upload, delete the PYPI_API_TOKEN secret.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
