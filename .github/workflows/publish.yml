name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write  # Required for PyPI Trusted Publishing (OIDC)
  contents: read

jobs:
  publish:
    name: build and publish
    runs-on: ubuntu-latest
    # Restrict to the repo that owns the package to avoid abuse if forks exist
    if: github.repository == 'Omonire/great-limiter'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # Build once from a clean checkout
      - name: Build distributions
        run: python -m build

      # Sanity-check the distribution metadata before uploading
      - name: Check distributions
        run: twine check dist/*

      # Publish to PyPI via Trusted Publishing (OIDC). No API token is stored.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
