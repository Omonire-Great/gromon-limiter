name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch: a rate limiter with 195 tests does
# not need four identical runs racing to be the one that reports.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Redis tests fall back to fakeredis, which runs the real Lua scripts
      # in-process via lupa, so the Redis code path is covered without a server.
      - name: Test
        run: python -m pytest -q -ra --cov=great_limiter --cov-report=term-missing

      - name: Lint
        run: python -m ruff check great_limiter tests examples

      - name: Types
        run: python -m mypy

  # Proves the package builds and installs, and that the wheel is importable on
  # a clean interpreter with no source tree present.
  package:
    name: build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Smoke test the wheel
        run: |
          pip install dist/*.whl
          cd "${{ runner.temp }}"
          python - <<'PY'
          from great_limiter import AuthLimiter, Identity, LimiterCore, MemoryStorage, RateLimit
          from great_limiter.config import Settings

          assert RateLimit.parse("100/5 minutes").window == 300

          core = LimiterCore(
              Settings(key_salt="smoke-test-salt-not-secret", default_limit="1/minute"),
              MemoryStorage(),
          )
          identity = Identity(ip="1.2.3.4")
          assert core.check(identity, path="/login", method="POST").allowed
          assert not core.check(identity, path="/login", method="POST").allowed
          print("wheel smoke test passed")
          PY
